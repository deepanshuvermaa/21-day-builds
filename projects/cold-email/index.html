<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cold Email Personalizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #fff; color: #1a1a1a; line-height: 1.6; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    
    /* Hero */
    .hero { text-align: center; padding: 80px 0 48px; }
    .hero h1 { font-size: 2.4rem; font-weight: 700; margin-bottom: 12px; }
    .hero p { font-size: 1.1rem; color: #555; max-width: 600px; margin: 0 auto; }
    .badge { display: inline-block; background: #f0f4ff; color: #3b5bdb; font-size: 0.75rem; font-weight: 600; padding: 4px 12px; border-radius: 20px; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Form */
    .form-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 16px; padding: 40px; margin-bottom: 48px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 0.8rem; font-weight: 500; color: #444; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
    input, textarea, select { font-family: 'Poppins', sans-serif; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem; transition: border-color 0.2s; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #3b5bdb; }
    textarea { resize: vertical; min-height: 80px; }
    .section-label { font-size: 0.7rem; font-weight: 600; color: #3b5bdb; text-transform: uppercase; letter-spacing: 1px; margin: 24px 0 12px; grid-column: 1 / -1; }

    .btn { font-family: 'Poppins', sans-serif; padding: 14px 32px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: #1a1a1a; color: #fff; margin-top: 28px; }
    .btn-primary:hover { background: #333; }
    .btn-primary:disabled { background: #999; cursor: not-allowed; }
    .btn-sm { padding: 8px 16px; font-size: 0.78rem; }
    .btn-outline { background: #fff; border: 1px solid #ddd; color: #333; }
    .btn-outline:hover { border-color: #333; }

    /* Results */
    .results { display: none; margin-bottom: 80px; }
    .results-header { text-align: center; margin-bottom: 32px; }
    .results-header h2 { font-size: 1.5rem; font-weight: 600; }
    .variants-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .variant-card { border: 1px solid #e8e8e8; border-radius: 12px; padding: 28px; position: relative; }
    .variant-label { font-size: 0.7rem; font-weight: 600; color: #3b5bdb; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
    .subject-line { font-weight: 600; font-size: 1rem; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #f0f0f0; }
    .email-body { font-size: 0.88rem; color: #333; white-space: pre-wrap; margin-bottom: 20px; }
    .variant-meta { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 16px; border-top: 1px solid #f0f0f0; }
    .char-count { font-size: 0.75rem; color: #888; }
    .spam-score { font-size: 0.75rem; font-weight: 500; padding: 4px 10px; border-radius: 12px; }
    .spam-low { background: #e6f9e6; color: #1a7a1a; }
    .spam-med { background: #fff3e0; color: #b36b00; }
    .spam-high { background: #fde8e8; color: #c0392b; }
    .variant-actions { display: flex; gap: 8px; margin-top: 12px; }

    .toast { position: fixed; bottom: 24px; right: 24px; background: #1a1a1a; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 0.82rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }

    .loading { display: none; text-align: center; padding: 48px; }
    .loading.active { display: block; }
    .spinner { width: 32px; height: 32px; border: 3px solid #eee; border-top-color: #3b5bdb; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .form-grid, .variants-grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <span class="badge">AI-Powered</span>
      <h1>Cold Email Personalizer</h1>
      <p>Generate hyper-personalized cold emails that get replies. Two variants, zero spam triggers, one click.</p>
    </section>

    <div class="form-card">
      <form id="emailForm">
        <div class="form-grid">
          <div class="section-label">Prospect Details</div>
          <div class="form-group"><label>Prospect Name</label><input type="text" id="prospectName" required placeholder="Jane Smith"></div>
          <div class="form-group"><label>Company</label><input type="text" id="company" required placeholder="Acme Corp"></div>
          <div class="form-group"><label>Role</label><input type="text" id="role" required placeholder="VP of Sales"></div>
          <div class="form-group"><label>Recent Achievement</label><input type="text" id="achievement" required placeholder="Raised Series B, launched new product..."></div>

          <div class="section-label">Your Details</div>
          <div class="form-group"><label>Your Name</label><input type="text" id="senderName" required placeholder="John Doe"></div>
          <div class="form-group"><label>Your Company</label><input type="text" id="senderCompany" required placeholder="SalesFlow"></div>
          <div class="form-group full"><label>Value Proposition</label><textarea id="valueProp" required placeholder="What specific value do you offer this prospect?"></textarea></div>
          <div class="form-group"><label>Call to Action</label><input type="text" id="cta" required placeholder="15-min call this week?"></div>
          <div class="form-group"><label>Tone</label>
            <select id="tone">
              <option value="formal">Formal</option>
              <option value="conversational" selected>Conversational</option>
              <option value="direct">Direct</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Generate Email Variants</button>
      </form>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p style="color:#555; font-size:0.9rem;">Crafting personalized emails...</p>
    </div>

    <section class="results" id="results">
      <div class="results-header"><h2>Your Email Variants</h2></div>
      <div class="variants-grid" id="variantsGrid"></div>
    </section>
  </div>

  <div class="toast" id="toast">Copied to clipboard</div>

  <script>
    const SPAM_WORDS = ['free','guarantee','no obligation','winner','urgent','act now','limited time','click here','buy now','order now','don\'t delete','congratulations','dear friend','for free','get it now','great offer','increase','incredible deal','no cost','no fees','no catch','offer','opportunity','promise','risk-free','satisfaction','special promotion','this isn\'t spam','unbelievable','what are you waiting for','while supplies last','you have been selected','amazing','cancel anytime','check or money order','click below','compare','discount','do it today','don\'t hesitate','double your','earn money','exclusive deal','expire','extra income','fast cash','financial freedom','hidden','info you requested','instant','investment','join millions','lowest price'];

    function getSpamScore(text) {
      const lower = text.toLowerCase();
      const found = SPAM_WORDS.filter(w => lower.includes(w));
      return { count: found.length, words: found };
    }

    function renderSpam(score) {
      const cls = score.count === 0 ? 'spam-low' : score.count <= 2 ? 'spam-med' : 'spam-high';
      const label = score.count === 0 ? '✓ Clean' : `⚠ ${score.count} trigger${score.count > 1 ? 's' : ''}`;
      return `<span class="spam-score ${cls}" title="${score.words.join(', ')}">${label}</span>`;
    }

    function renderVariant(variant, idx) {
      const full = variant.subject + ' ' + variant.body;
      const spam = getSpamScore(full);
      return `<div class="variant-card" id="variant-${idx}">
        <div class="variant-label">Variant ${idx + 1}</div>
        <div class="subject-line">${variant.subject}</div>
        <div class="email-body">${variant.body}</div>
        <div class="variant-meta">
          <span class="char-count">${full.length} chars</span>
          ${renderSpam(spam)}
        </div>
        <div class="variant-actions">
          <button class="btn btn-sm btn-outline" onclick="copyVariant(${idx})">Copy</button>
          <button class="btn btn-sm btn-outline" onclick="regenerate(${idx})">Regenerate</button>
        </div>
      </div>`;
    }

    let lastPayload = null;
    let variants = [];

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function copyVariant(idx) {
      const v = variants[idx];
      navigator.clipboard.writeText(`Subject: ${v.subject}\n\n${v.body}`);
      showToast('Copied to clipboard');
    }

    async function regenerate(idx) {
      if (!lastPayload) return;
      const card = document.getElementById(`variant-${idx}`);
      card.style.opacity = '0.5';
      try {
        const res = await fetch('/cold-email/api/personalize', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(lastPayload) });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        variants[idx] = data.variants[0];
        document.getElementById('variantsGrid').innerHTML = variants.map((v, i) => renderVariant(v, i)).join('');
      } catch (e) {
        showToast('Error: ' + e.message);
        card.style.opacity = '1';
      }
    }

    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        prospectName: document.getElementById('prospectName').value,
        company: document.getElementById('company').value,
        role: document.getElementById('role').value,
        achievement: document.getElementById('achievement').value,
        senderName: document.getElementById('senderName').value,
        senderCompany: document.getElementById('senderCompany').value,
        valueProp: document.getElementById('valueProp').value,
        cta: document.getElementById('cta').value,
        tone: document.getElementById('tone').value
      };
      lastPayload = payload;

      document.getElementById('results').style.display = 'none';
      document.getElementById('loading').classList.add('active');
      document.getElementById('submitBtn').disabled = true;

      try {
        const res = await fetch('/cold-email/api/personalize', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        variants = data.variants;
        document.getElementById('variantsGrid').innerHTML = variants.map((v, i) => renderVariant(v, i)).join('');
        document.getElementById('results').style.display = 'block';
      } catch (err) {
        showToast('Error: ' + err.message);
      } finally {
        document.getElementById('loading').classList.remove('active');
        document.getElementById('submitBtn').disabled = false;
      }
    });
  </script>
</body>
</html>
