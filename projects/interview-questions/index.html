<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Question Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f7f7f7; color: #1a1a1a; line-height: 1.6; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #555; font-size: 1.1rem; margin-bottom: 2rem; }
    textarea { width: 100%; min-height: 180px; padding: 1rem; border: 2px solid #e0e0e0; border-radius: 10px; font-family: inherit; font-size: 0.95rem; resize: vertical; transition: border-color 0.2s; }
    textarea:focus { outline: none; border-color: #f69251; }
    .settings { display: flex; gap: 1rem; margin: 1.5rem 0; flex-wrap: wrap; align-items: center; }
    .settings label { font-size: 0.85rem; font-weight: 500; color: #555; }
    .settings select, .settings input[type="range"] { padding: 0.5rem; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; }
    .settings select { min-width: 160px; }
    .slider-group { display: flex; align-items: center; gap: 0.5rem; }
    .slider-group input[type="range"] { width: 120px; accent-color: #f69251; }
    .btn { background: #f69251; color: #fff; border: none; padding: 0.8rem 2rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .results { margin-top: 2rem; }
    .card { background: #fff; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card h3 { font-size: 1.05rem; margin-bottom: 0.75rem; }
    .badges { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .badge { padding: 0.25rem 0.7rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .badge-easy { background: #d4f5e2; color: #1a7a42; }
    .badge-medium { background: #fff3cd; color: #856404; }
    .badge-hard { background: #fdd; color: #a33; }
    .badge-cat { background: #e8e0ff; color: #5b3ea8; }
    .evaluates { font-size: 0.9rem; color: #555; margin-bottom: 0.75rem; }
    .expandable { margin-top: 0.75rem; }
    .expand-btn { background: none; border: none; color: #f69251; font-weight: 600; cursor: pointer; font-size: 0.85rem; padding: 0; }
    .expand-content { display: none; margin-top: 0.75rem; }
    .expand-content.open { display: block; }
    .signals li { color: #1a7a42; font-size: 0.85rem; margin: 0.3rem 0; }
    .flags li { color: #c0392b; font-size: 0.85rem; margin: 0.3rem 0; }
    .follow-ups { margin-top: 0.75rem; }
    .follow-ups h4 { font-size: 0.85rem; color: #555; margin-bottom: 0.3rem; }
    .follow-ups li { font-size: 0.85rem; margin: 0.2rem 0; }
    .export-row { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
    .btn-sm { padding: 0.5rem 1.2rem; font-size: 0.85rem; border-radius: 6px; background: #333; color: #fff; border: none; cursor: pointer; font-weight: 500; }
    .btn-sm:hover { background: #555; }
    .loading { text-align: center; padding: 2rem; color: #888; }
    @media print {
      body { background: #fff; }
      .btn, .export-row, .settings, textarea, .subtitle, .expand-btn { display: none; }
      .expand-content { display: block !important; }
      .card { box-shadow: none; border: 1px solid #eee; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Interview Question Generator</h1>
    <p class="subtitle">Paste a job description. Get targeted technical interview questions with evaluation criteria.</p>

    <textarea id="jd" placeholder="e.g. We are looking for a Senior Backend Engineer with experience in Node.js, PostgreSQL, microservices architecture, AWS (ECS, Lambda, DynamoDB), and CI/CD pipelines. The role involves designing scalable APIs, optimizing database performance, and mentoring junior developers..."></textarea>

    <div class="settings">
      <div>
        <label>Role Level</label><br>
        <select id="level">
          <option>Junior</option><option>Mid</option><option selected>Senior</option><option>Staff</option>
        </select>
      </div>
      <div>
        <label>Interview Round</label><br>
        <select id="round">
          <option>Technical Screening</option><option>System Design</option><option>Coding</option><option>Behavioral</option><option>Final Round</option>
        </select>
      </div>
      <div class="slider-group">
        <div>
          <label>Questions: <span id="numVal">10</span></label><br>
          <input type="range" id="num" min="5" max="20" value="10">
        </div>
      </div>
    </div>

    <button class="btn" id="generate">Generate Questions</button>

    <div class="results" id="results"></div>
  </div>

  <script>
    const numSlider = document.getElementById('num');
    const numVal = document.getElementById('numVal');
    numSlider.addEventListener('input', () => numVal.textContent = numSlider.value);

    document.getElementById('generate').addEventListener('click', async () => {
      const jd = document.getElementById('jd').value.trim();
      if (!jd) return alert('Please paste a job description.');

      const btn = document.getElementById('generate');
      const results = document.getElementById('results');
      btn.disabled = true;
      btn.textContent = 'Generating...';
      results.innerHTML = '<div class="loading">Generating technical questions...</div>';

      try {
        const res = await fetch('/interview-questions/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            jobDescription: jd,
            roleLevel: document.getElementById('level').value,
            interviewRound: document.getElementById('round').value,
            numQuestions: parseInt(numSlider.value)
          })
        });
        const questions = await res.json();
        if (questions.error) throw new Error(questions.error);
        renderQuestions(questions);
      } catch (e) {
        results.innerHTML = `<div class="loading">Error: ${e.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate Questions';
      }
    });

    function renderQuestions(questions) {
      const results = document.getElementById('results');
      let html = questions.map((q, i) => {
        const diffClass = q.difficulty === 'Easy' ? 'badge-easy' : q.difficulty === 'Hard' ? 'badge-hard' : 'badge-medium';
        return `<div class="card">
          <h3>${i + 1}. ${q.question}</h3>
          <div class="badges">
            <span class="badge ${diffClass}">${q.difficulty}</span>
            <span class="badge badge-cat">${q.category}</span>
          </div>
          <p class="evaluates"><strong>What this evaluates:</strong> ${q.evaluates}</p>
          <div class="expandable">
            <button class="expand-btn" onclick="this.nextElementSibling.classList.toggle('open')">▶ Strong answer signals & Red flags</button>
            <div class="expand-content">
              <ul class="signals">${q.strongSignals.map(s => `<li>✓ ${s}</li>`).join('')}</ul>
              <ul class="flags">${q.redFlags.map(f => `<li>✗ ${f}</li>`).join('')}</ul>
            </div>
          </div>
          <div class="follow-ups">
            <h4>Follow-up questions:</h4>
            <ul>${q.followUps.map(f => `<li>${f}</li>`).join('')}</ul>
          </div>
        </div>`;
      }).join('');

      html += `<div class="export-row">
        <button class="btn-sm" onclick="window.print()">Export as PDF</button>
        <button class="btn-sm" onclick="exportJSON()">Export as JSON</button>
      </div>`;
      results.innerHTML = html;
      window._lastQuestions = questions;
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(window._lastQuestions, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'interview-questions.json';
      a.click();
    }
  </script>
</body>
</html>
